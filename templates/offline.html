{% extends 'base.html' %}
{% block title %}You're offline — Al-Hikma LMS{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="text-align:center;max-width:420px">
    <div style="width:88px;height:88px;border-radius:50%;background:var(--primary-blue-subtle);color:var(--primary-blue);display:flex;align-items:center;justify-content:center;margin:0 auto 22px">
      <i data-lucide="wifi-off" style="width:42px;height:42px"></i>
    </div>
    <h1 class="t-heading-bp" style="font-size:1.6rem;margin-bottom:10px">You're offline</h1>
    <p class="t-body" style="margin-bottom:26px">
      No internet connection right now. Pages you visited recently may still be
      available — everything else will load once you're back online.
    </p>
    <button onclick="window.location.reload()" class="btn btn-ink btn-lg">
      <i data-lucide="rotate-cw"></i> Try Again
    </button>
  </div>
</div>
{% endblock %}
