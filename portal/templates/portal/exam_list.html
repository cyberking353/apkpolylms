{% extends 'portal/base.html' %}
{% block title %}Exams{% endblock %}
{% block page_title %}Exams{% endblock %}
{% block content %}
<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
  <a href="{% if q %}?q={{ q|urlencode }}{% endif %}" class="btn {% if not active_status %}btn-ink{% else %}btn-ghost{% endif %} btn-sm">All</a>
  <a href="?status=draft{% if q %}&q={{ q|urlencode }}{% endif %}" class="btn {% if active_status == 'draft' %}btn-ink{% else %}btn-ghost{% endif %} btn-sm">Draft</a>
  <a href="?status=pending{% if q %}&q={{ q|urlencode }}{% endif %}" class="btn {% if active_status == 'pending' %}btn-ink{% else %}btn-ghost{% endif %} btn-sm">Pending Approval</a>
  <a href="?status=approved{% if q %}&q={{ q|urlencode }}{% endif %}" class="btn {% if active_status == 'approved' %}btn-ink{% else %}btn-ghost{% endif %} btn-sm">Approved</a>
</div>

<form method="get" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
  {% if active_status %}<input type="hidden" name="status" value="{{ active_status }}">{% endif %}
  <input type="text" name="q" value="{{ q }}" placeholder="Search by course code, course or exam title…"
         hx-get="{{ request.path }}" hx-target="#exams-results" hx-swap="outerHTML" hx-include="closest form" hx-trigger="input changed delay:300ms, search"
         style="flex:1;min-width:200px;padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:.86rem">
  {% if q %}<a href="{% if active_status %}?status={{ active_status }}{% endif %}" class="btn btn-ghost btn-sm">Clear</a>{% endif %}
</form>

{% include "portal/_exam_table.html" %}

{% endblock %}
