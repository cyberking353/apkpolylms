{% extends 'portal/base.html' %}
{% block title %}Announcements{% endblock %}
{% block page_title %}Announcements{% endblock %}
{% block topbar_actions %}
<a href="{% url 'portal:announcement_create' %}" class="btn btn-teal btn-sm">+ New Announcement</a>
{% endblock %}
{% block content %}
<form method="get" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
  <input type="text" name="q" value="{{ q }}" placeholder="Search announcements…"
         hx-get="{{ request.path }}" hx-target="#announcements-results" hx-swap="outerHTML" hx-include="closest form" hx-trigger="input changed delay:300ms, search"
         style="flex:1;min-width:200px;padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:.86rem">
  {% if q %}<a href="{% url 'portal:announcement_list' %}" class="btn btn-ghost btn-sm">Clear</a>{% endif %}
</form>

{% include "portal/_announcement_table.html" %}

{% endblock %}
