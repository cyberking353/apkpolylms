{% extends 'portal/base.html' %}
{% block title %}Lecturers{% endblock %}
{% block page_title %}Lecturers{% endblock %}
{% block topbar_actions %}<a href="{% url 'portal:lecturer_create' %}" class="btn btn-teal btn-sm">+ New Lecturer</a>{% endblock %}
{% block content %}
<form method="get" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
  <input type="text" name="q" value="{{ q }}" placeholder="Search by name, email or staff ID…"
         hx-get="{{ request.path }}" hx-target="#lecturers-results" hx-swap="outerHTML" hx-include="closest form" hx-trigger="input changed delay:300ms, search"
         style="flex:1;min-width:200px;padding:9px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:.86rem">
  <select name="dept" hx-get="{{ request.path }}" hx-target="#lecturers-results" hx-swap="outerHTML" hx-include="closest form" hx-trigger="change"
          style="padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font-size:.85rem">
    <option value="">All Departments</option>
    {% for code,label in dept_choices %}
    <option value="{{ code }}" {% if dept == code %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  {% if q or dept %}<a href="{% url 'portal:lecturer_list' %}" class="btn btn-ghost btn-sm">Clear</a>{% endif %}
</form>

{% include "portal/_lecturer_table.html" %}

{% endblock %}
