server {
    listen 80;
    server_name _;

    # Match the largest upload that the app allows (200 MB video cap).
    client_max_body_size 205m;

    charset utf-8;

    # ---- Django static files (built by collectstatic into the shared volume)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- User uploads (avatars, thumbnails, lecture notes/videos)
    location /media/ {
        alias /app/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ---- App
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}