# Al-Hikma LMS — Docker Compose stack (Dokploy / Traefik)
#
# Deployment target: Dokploy-managed Docker host. Traefik is the reverse
# proxy / load balancer, so there is NO nginx service here. Postgres is
# provisioned externally by the PaaS and provided via a single DATABASE_URL.
#
# Usage (local test):
#   cp .env.example .env   (fill in values)
#   docker compose up -d --build
#
# Usage (Dokploy): deploy from this compose file; set the env vars in the
# PaaS UI. Dokploy attaches every service to the external 'dokploy-network'
# so Traefik can route to it.

services:
  backend:
    build:
      context: .
      args:
        # Overridable (env): PIP_INDEX_URL=https://some.mirror/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: alhikma_lms_backend
    restart: always
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      PORT: ${PORT:-8000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # Single connection string for the externally-provisioned database.
      DATABASE_URL: ${DATABASE_URL:-}
      # Portal <-> SMS integration secrets (must match the Portal's config).
      PORTAL_BACKEND_URL: ${PORTAL_BACKEND_URL:-}
      LMS_API_TOKEN: ${LMS_API_TOKEN:-}
      PORTAL_SSO_SECRET: ${PORTAL_SSO_SECRET:-}
      # Redis is part of this stack (cache + sessions).
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/healthz'); r=c.getresponse().status; print('healthz:',r); sys.exit(0 if r<500 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    container_name: alhikma_lms_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

networks:
  # Created by Dokploy/Traefik; must exist on the host before this stack starts.
  dokploy-network:
    external: true

volumes:
  redis_data: