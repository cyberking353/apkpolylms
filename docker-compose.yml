# Al-Hikma LMS — Docker Compose stack
#
# Usage:
#   cp .env.example .env   (then fill in real values)
#   docker compose up -d          # build + start all containers
#   docker compose ps             # check they're all healthy/running
#   docker compose logs -f web    # follow app output
#   docker compose down           # stop everything (keeps data volumes)
#   docker compose down -v        # stop AND delete all data (DB, uploads, static)
#
# Secrets come from the local .env file which is gitignored and NEVER baked
# into the image. DB_HOST/REDIS_URL are overridden here to the compose
# service names because inside the stack those hosts are "db" and "redis".

version: "3.7"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-alhikma_lms}
      POSTGRES_USER: ${DB_USER:-alhikma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-alhikma} -d $${DB_NAME:-alhikma_lms}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Not published to the host — only reachable inside the compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
    # Not published to the host either.

  web:
    build:
      context: .
      args:
        # Overridable in .env: PIP_INDEX_URL=https://some.mirror/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose service names override anything the operator set in .env.
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "python", "-c",
             "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/healthz'); r=c.getresponse().status; print('healthz:',r); sys.exit(0 if r<500 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Domains/TLS come later; currently an HTTP reverse proxy.
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  pg_data:
  redis_data:
  static_volume:
  media_volume: